<!doctype html>
<html lang="de" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1c1c1e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="tricaps">
  <title>tricaps</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png?v=25">
  <link rel="icon" type="image/png" sizes="64x64" href="icons/favicon-light.png?v=25" media="(prefers-color-scheme: light)">
  <link rel="icon" type="image/png" sizes="64x64" href="icons/favicon-dark.png?v=25" media="(prefers-color-scheme: dark)">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800&display=swap">
  <link rel="stylesheet" href="app.css?v=25">
</head>
<body>
  <header class="bar">
    <button id="btn-back" class="icon-btn" hidden aria-label="Zurück">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <h1 class="logo">tri<span>caps</span></h1>
    <button id="btn-theme" class="icon-btn" aria-label="Hell/Dunkel umschalten">
      <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5a8.5 8.5 0 1 0 11 11z"/></svg>
    </button>
    <button id="btn-settings" class="icon-btn" aria-label="Einstellungen">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
    <button id="btn-export" class="export-btn" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3"/><path d="m7 8 5-5 5 5"/><path d="M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg>
      Exportieren
    </button>
  </header>

  <main>
    <section id="screen-start" class="screen">
      <label class="big-btn">
        <input id="file-input" type="file" accept="video/*" hidden>
        <span>Video wählen</span>
      </label>
      <p class="hint" id="key-hint" hidden>Zuerst in den Einstellungen den Groq API-Key eintragen.</p>
    </section>

    <section id="screen-busy" class="screen" hidden>
      <div class="spinner"></div>
      <div id="done-check" hidden>
        <svg class="check" viewBox="0 0 52 52" aria-hidden="true">
          <circle cx="26" cy="26" r="24"/>
          <path d="M15 27.5l7.5 7.5L37.5 19"/>
        </svg>
      </div>
      <p id="busy-text">Arbeite…</p>
      <div class="progress"><div id="busy-bar"></div></div>
      <button id="btn-save" class="big-btn" hidden>Speichern / Teilen</button>
      <p class="hint" id="busy-hint"></p>
    </section>

    <section id="screen-editor" class="screen" hidden>
      <div class="stage-wrap" id="stage-wrap">
        <div class="stage" id="stage">
          <video id="preview" playsinline webkit-playsinline preload="auto"></video>
          <canvas id="frame" hidden></canvas>
          <canvas id="overlay"></canvas>
        </div>

        <div class="panel" id="edit-panel" hidden>
          <input id="edit-text" enterkeyhint="done" autocapitalize="sentences" autocomplete="off" aria-label="Caption-Text">
          <div class="panel-actions">
            <button class="pill" id="btn-split">Teilen</button>
            <button class="pill" id="btn-merge" aria-label="Mit nächster Caption verbinden">Verbinden</button>
            <button class="pill" id="btn-delete">Löschen</button>
            <button class="pill strong" id="btn-done">Fertig</button>
          </div>
        </div>

        <div class="panel" id="style-panel" hidden>
          <label class="slider">
            <span>Höhe</span>
            <input id="pos-y" type="range" min="0.08" max="0.95" step="0.005">
          </label>
          <label class="slider">
            <span>Grösse</span>
            <input id="size" type="range" min="0.03" max="0.2" step="0.002">
          </label>
        </div>
      </div>

      <div class="transport">
        <button id="btn-play" class="icon-btn" aria-label="Abspielen">
          <svg class="play" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15a1 1 0 0 0 1.5.86l12-7.5a1 1 0 0 0 0-1.72l-12-7.5A1 1 0 0 0 7 4.5z"/></svg>
          <svg class="pause" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>
        </button>
        <span id="time-label" class="time-label">0:00.0</span>
        <button id="btn-undo" class="icon-btn" aria-label="Rückgängig" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>
        </button>
        <button id="btn-style" class="icon-btn text-btn" aria-label="Höhe und Grösse">Aa</button>
      </div>

      <div class="timeline-wrap">
        <div class="timeline" id="timeline">
          <div class="tl-inner">
            <div class="tl-track" id="tl-track">
              <canvas class="tl-thumbs" id="tl-thumbs"></canvas>
              <div class="tl-captions" id="tl-captions"></div>
            </div>
          </div>
        </div>
        <div class="playhead"></div>
      </div>

    </section>

    <section id="screen-settings" class="screen" hidden>
      <label class="field">
        <span>Groq API-Key</span>
        <input id="api-key" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="gsk_…">
      </label>
      <p class="hint">Gratis-Key holen auf <a href="https://console.groq.com/keys" target="_blank" rel="noopener">console.groq.com/keys</a>. Der Key bleibt nur auf diesem Gerät.</p>
      <label class="field">
        <span>Wörter pro Caption (max.)</span>
        <input id="max-words" type="number" min="1" max="8" inputmode="numeric">
      </label>
      <button id="btn-settings-done" class="big-btn">Fertig</button>
    </section>
  </main>

  <script type="module" src="js/app.js?v=25"></script>
</body>
</html>
